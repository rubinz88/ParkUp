services:
  parkup-database:
    image: postgres:17.5
    env_file:
      - .env
    container_name: parkup-database
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - APP_USER=${PU_USER}
      - APP_USER_PASSWORD=${PU_USER_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgresql-db/init_db.sh:/docker-entrypoint-initdb.d/init_db.sh
    networks:
      - parkup-network
    ports:
      - "5432:5432"

  parkup-backend:
    build:
      context: ../../ParkUp/parkup-backend/api
      dockerfile: Dockerfile
    container_name: parkup-backend
    restart: unless-stopped
    depends_on:
      parkup-database:
        condition: service_healthy
    environment:
      - DB_HOST=parkup-database
      - DB_PORT=5432
      - DB_USER=${PU_USER}
      - DB_PASSWORD=${PU_USER_PASSWORD}
      - DB_NAME=${POSTGRES_DB}
    networks:
      - parkup-network
    ports:
      - "8002:8080"

  adminer:
    image: adminer:5.3.0
    container_name: parkup-adminer
    restart: unless-stopped
    environment:
      ADMINER_DEFAULT_SERVER: parkup-database
    networks:
      - parkup-network
    ports:
      - "8000:8080"

volumes:
  db_data:

networks:
  parkup-network:
    driver: bridge
