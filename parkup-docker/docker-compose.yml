services:
  parkup-database:
    image: postgres:17.5
    env_file:
      - .env
    container_name: parkup-database
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - APP_USER=${PU_USER}
      - APP_USER_PASSWORD=${PU_USER}

    volumes:
      - db_data:/var/lib/postgresql/data
      - ./postgresql-db/init_db.sh:/docker-entrypoint-initdb.d/init_db.sh
    networks:
      - parkup-network
    ports:
      - "5432:5432"

volumes:
  db_data:

networks:
  parkup-network:
    driver: bridge
